# AgileX Piper 6-DoF arm primitive with one package identity and two backends.
# `backend: ros2` preserves the original vendored piper_ros behavior.
# `backend: sdk` selects direct piper_sdk MCP/gripper/health capabilities.
# The selector and all backend-specific defaults are documented in config.spec.
manifestVersion: 1

package:
  name: robonix.primitive.agilex.piper.arm
  version: 0.1.0
  vendor: robonix
  description: AgileX Piper 6-DoF arm primitive with selectable ROS 2 and direct-SDK backends.
  license: Apache-2.0
  tags: [primitive, arm, agilex, piper, ros2]
  maintainers: ["lhw2002426 <lhw2002426@users.noreply.github.com>"]

build: bash scripts/build.sh
start: bash scripts/start.sh

capabilities:
  - name: robonix/primitive/arm/driver
  - name: robonix/primitive/arm/joint_states
  - name: robonix/primitive/arm/joint_command
  - name: robonix/primitive/arm/end_pose
  - name: robonix/primitive/arm/pos_command
  - name: robonix/primitive/arm/arm_status
  - name: robonix/primitive/arm/status
  - name: robonix/primitive/arm/set_enabled
  - name: robonix/primitive/arm/enable_arm
  - name: robonix/primitive/arm/disable_arm
  - name: robonix/primitive/arm/enable_gripper
  - name: robonix/primitive/arm/disable_gripper
  - name: robonix/primitive/arm/jog_joint
  - name: robonix/primitive/arm/execute_joint_trajectory
  - name: robonix/primitive/arm/set_gripper
  - name: robonix/primitive/arm/set_gripper_zero
  - name: robonix/primitive/arm/emergency_stop
  - name: robonix/primitive/health/state
  - name: robonix/primitive/health/stream
